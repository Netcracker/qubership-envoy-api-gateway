{{- if and (hasKey .Values "MANAGED_BY") (eq .Values.MANAGED_BY "argocd") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pre-upgrade 
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/component: pre-upgrade
automountServiceAccountToken: true
{{- end }}
