---
name: Helm Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-package:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest' # or pin a specific version, e.g. 'v3.14.0'

      # 3. Package the Helm chart
      - name: Package Envoy Gateway Helm chart
        run: |
          helm package ./charts/envoy-gateway --destination ./dist
      - name: Package Envoy Gateway custom resources Helm chart
        run: |
          helm package ./charts/envoy-gateway-cr --destination ./dist

      # 4. (Optional) Upload the packaged chart as a build artifact
      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./dist/*.tgz
